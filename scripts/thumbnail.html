<!doctype html>
<html lang="ko"><head><meta charset="utf-8">
<title>thumbnail</title>
<link href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=Noto+Sans+KR:wght@500;800&display=swap" rel="stylesheet">
<style>
  html,body{margin:0;width:1280px;height:800px;overflow:hidden;background:#06122a}
  svg{display:block}
  .t{font-family:"Black Han Sans","Noto Sans KR",sans-serif}
  .s{font-family:"Noto Sans KR",sans-serif;font-weight:800}
</style></head>
<body>
<!-- 국군 통합방위: 하늘(공군)·바다(해군)·땅(육군)·상륙(해병대)을 하나의 방위 네트워크 돔이 감싸는 장면 -->
<svg width="1280" height="800" viewBox="0 0 1280 800" xmlns="http://www.w3.org/2000/svg">
<defs>
  <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#040b1f"/><stop offset=".45" stop-color="#14306a"/>
    <stop offset=".72" stop-color="#c2552e"/><stop offset=".84" stop-color="#f6b25a"/>
  </linearGradient>
  <radialGradient id="sun" cx=".66" cy=".7" r=".42">
    <stop offset="0" stop-color="#fff3c4" stop-opacity="1"/><stop offset=".12" stop-color="#ffd27a" stop-opacity=".95"/>
    <stop offset=".4" stop-color="#ff8a3d" stop-opacity=".35"/><stop offset="1" stop-color="#ff8a3d" stop-opacity="0"/>
  </radialGradient>
  <linearGradient id="sea" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#2d4f86"/><stop offset=".3" stop-color="#173464"/><stop offset="1" stop-color="#050f26"/>
  </linearGradient>
  <linearGradient id="glint" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#ffd890" stop-opacity=".9"/><stop offset="1" stop-color="#ffd890" stop-opacity="0"/>
  </linearGradient>
  <linearGradient id="mtnFar" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#5a3b52"/><stop offset="1" stop-color="#2a2140"/></linearGradient>
  <linearGradient id="mtnNear" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#1d2a2c"/><stop offset="1" stop-color="#070d14"/></linearGradient>
  <radialGradient id="dome" cx=".5" cy="1" r=".75">
    <stop offset=".72" stop-color="#5fd0ff" stop-opacity="0"/><stop offset=".93" stop-color="#5fd0ff" stop-opacity=".16"/>
    <stop offset="1" stop-color="#9be6ff" stop-opacity=".5"/>
  </radialGradient>
  <linearGradient id="trail" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#fff" stop-opacity="0"/><stop offset="1" stop-color="#fff" stop-opacity=".75"/></linearGradient>
  <linearGradient id="shade" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#030a1c" stop-opacity=".92"/><stop offset=".42" stop-color="#030a1c" stop-opacity=".55"/><stop offset=".62" stop-color="#030a1c" stop-opacity="0"/>
  </linearGradient>
  <pattern id="hex" width="56" height="48.5" patternUnits="userSpaceOnUse">
    <path d="M14 0h28l14 24.25-14 24.25H14L0 24.25z" fill="none" stroke="#8fe3ff" stroke-width="1" stroke-opacity=".22"/>
  </pattern>
  <clipPath id="domeClip"><path d="M60 640A600 560 0 0 1 1260 640z"/></clipPath>
  <filter id="glow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  <filter id="soft"><feGaussianBlur stdDeviation="1.2"/></filter>
  <filter id="haze"><feGaussianBlur stdDeviation="18"/></filter>
</defs>

<!-- 하늘·태양 -->
<rect width="1280" height="800" fill="url(#sky)"/>
<rect width="1280" height="800" fill="url(#sun)"/>
<g fill="#fff" opacity=".8">
  <circle cx="90" cy="60" r="1.2"/><circle cx="210" cy="120" r=".9"/><circle cx="330" cy="40" r="1.1"/><circle cx="520" cy="90" r=".8"/>
  <circle cx="690" cy="30" r="1.3"/><circle cx="860" cy="70" r=".9"/><circle cx="1010" cy="40" r="1.1"/><circle cx="1190" cy="100" r="1"/>
  <circle cx="440" cy="170" r=".8"/><circle cx="1120" cy="180" r=".8"/><circle cx="780" cy="150" r=".7"/>
</g>
<!-- 구름 띠 -->
<g filter="url(#haze)" opacity=".55">
  <ellipse cx="300" cy="430" rx="320" ry="26" fill="#f39a6a"/><ellipse cx="980" cy="400" rx="360" ry="22" fill="#ffb98a"/>
  <ellipse cx="700" cy="470" rx="420" ry="20" fill="#e2724e"/>
</g>

<!-- 먼 산맥 (육군 전선) -->
<path d="M520 560 L600 500 650 525 720 470 790 515 850 480 930 520 1000 465 1080 510 1150 470 1280 520 1280 600 520 600z" fill="url(#mtnFar)" opacity=".85"/>
<!-- 바다 -->
<rect y="560" width="1280" height="240" fill="url(#sea)"/>
<path d="M760 560 L900 800 L620 800z" fill="url(#glint)" opacity=".55"/>
<g stroke="#ffe0a3" stroke-linecap="round" opacity=".55">
  <path d="M800 585h46M770 610h70M820 640h52M740 668h96M800 700h60M700 735h120" stroke-width="2"/>
</g>
<g stroke="#7fa8e0" stroke-opacity=".25" stroke-width="1.5">
  <path d="M0 600h1280M0 640h1280M0 690h1280M0 750h1280"/>
</g>

<!-- 가까운 산과 능선 (육군) -->
<path d="M840 640 C900 560 960 540 1010 560 C1060 520 1120 500 1180 540 C1220 520 1260 530 1280 545 L1280 800 L760 800 C780 720 800 680 840 640z" fill="url(#mtnNear)"/>
<!-- 능선 위 장병 실루엣 + 태극기 -->
<g fill="#050a10">
  <g transform="translate(1040 548)">
    <circle cx="0" cy="-34" r="7"/><path d="M-9 -27h18l4 26h-7l-2 30h-5l-1-24-1 24h-5l-2-30h-7z"/>
    <path d="M-12 -40a13 8 0 0 1 24 0z"/><path d="M8 -24l26-12 2 3-25 13z"/>
  </g>
  <g transform="translate(1098 536)">
    <circle cx="0" cy="-34" r="7"/><path d="M-9 -27h18l4 26h-7l-2 30h-5l-1-24-1 24h-5l-2-30h-7z"/>
    <path d="M-12 -40a13 8 0 0 1 24 0z"/><path d="M-8 -22l-20 18 3 3 20-16z"/>
  </g>
  <rect x="1150" y="440" width="3" height="100"/>
</g>
<g transform="translate(1153 442)">
  <rect width="60" height="40" fill="#f4f1ea"/>
  <circle cx="30" cy="20" r="10" fill="#c8102e"/><path d="M20 20a10 10 0 0 0 20 0a5 5 0 0 0-10 0a5 5 0 0 1-10 0z" fill="#0047a0"/>
  <g stroke="#111" stroke-width="2"><path d="M8 6l6 6M9 34l5-5M46 6l6 6M46 34l6-5"/></g>
</g>
<!-- 전차 (육군) -->
<g transform="translate(930 650)" fill="#0a1218">
  <path d="M0 30h170l-14 22H14z"/><rect x="20" y="8" width="120" height="24" rx="5"/>
  <path d="M50 -10h60l10 18H40z"/><rect x="108" y="-6" width="96" height="6" rx="3"/>
  <g fill="#1d2b33"><circle cx="30" cy="42" r="7"/><circle cx="58" cy="44" r="7"/><circle cx="86" cy="44" r="7"/><circle cx="114" cy="44" r="7"/><circle cx="140" cy="42" r="7"/></g>
  <path d="M55 -10l4-16 3 0-2 16z"/>
</g>

<!-- 구축함 (해군) -->
<g transform="translate(150 548)">
  <path d="M0 40 L400 40 L380 72 L28 72z" fill="#0b1830"/>
  <path d="M60 40v-18h70v-16h40v-24h22v24h30v16h60v18z" fill="#0f2140"/>
  <path d="M190 -18v-46h4v46zM176 -40h32v4h-32zM183 -56h18v3h-18z" fill="#0f2140"/>
  <rect x="300" y="28" width="40" height="12" fill="#0f2140"/><rect x="335" y="31" width="44" height="4" fill="#0f2140"/>
  <rect x="210" y="2" width="16" height="8" fill="#ffcf7d" opacity=".9"/><rect x="150" y="16" width="10" height="5" fill="#ffcf7d" opacity=".8"/>
  <path d="M0 72 C120 84 280 84 400 70" stroke="#9fc4ff" stroke-opacity=".35" stroke-width="3" fill="none"/>
  <path d="M380 70 C420 76 470 76 520 72" stroke="#fff" stroke-opacity=".4" stroke-width="2" fill="none"/>
</g>
<!-- 상륙돌격장갑차와 물보라 (해병대) -->
<g transform="translate(620 700)">
  <path d="M0 18 L110 18 L124 0 L-6 0z" fill="#0a1424"/><rect x="30" y="-16" width="46" height="16" rx="3" fill="#0a1424"/>
  <rect x="70" y="-12" width="40" height="4" fill="#0a1424"/>
  <path d="M120 10 C150 0 170 24 200 14 M-10 14 C-40 4 -60 26 -90 14" stroke="#e8f3ff" stroke-opacity=".7" stroke-width="3" fill="none"/>
  <ellipse cx="60" cy="24" rx="80" ry="6" fill="#e8f3ff" opacity=".3"/>
</g>

<!-- 전투기 편대 + 비행운 (공군) -->
<g>
  <path d="M120 300 C380 230 620 180 860 150" stroke="url(#trail)" stroke-width="3" fill="none"/>
  <path d="M100 340 C380 270 640 220 900 196" stroke="url(#trail)" stroke-width="3" fill="none"/>
  <path d="M60 250 C320 190 560 150 800 120" stroke="url(#trail)" stroke-width="3" fill="none"/>
  <g fill="#0b1426">
    <g transform="translate(870 150) rotate(-12)"><path d="M0 0 L-60 -6 -78 -24 -84 -24 -76 -4 -96 -2 -100 0 -96 2 -76 4 -84 24 -78 24 -60 6z"/><path d="M-30 -2 L-50 -30 -42 -30 -20 -2z"/></g>
    <g transform="translate(912 196) rotate(-11)"><path d="M0 0 L-60 -6 -78 -24 -84 -24 -76 -4 -96 -2 -100 0 -96 2 -76 4 -84 24 -78 24 -60 6z"/><path d="M-30 -2 L-50 -30 -42 -30 -20 -2z"/></g>
    <g transform="translate(812 120) rotate(-12)"><path d="M0 0 L-60 -6 -78 -24 -84 -24 -76 -4 -96 -2 -100 0 -96 2 -76 4 -84 24 -78 24 -60 6z"/><path d="M-30 -2 L-50 -30 -42 -30 -20 -2z"/></g>
  </g>
  <!-- 헬기 -->
  <g transform="translate(1060 300)" fill="#0b1426">
    <ellipse cx="0" cy="0" rx="34" ry="13"/><path d="M28 -4 L86 -8 86 -2 30 6z"/><rect x="82" y="-20" width="4" height="22"/>
    <rect x="-70" y="-20" width="140" height="3" rx="1.5"/><rect x="-2" y="-20" width="4" height="8"/>
    <path d="M-20 13 L-24 22 M16 13 L20 22 M-30 22 H30" stroke="#0b1426" stroke-width="3"/>
  </g>
</g>

<!-- 통합방위 네트워크 돔 -->
<g clip-path="url(#domeClip)">
  <rect width="1280" height="800" fill="url(#hex)"/>
  <rect width="1280" height="800" fill="url(#dome)"/>
</g>
<path d="M60 640A600 560 0 0 1 1260 640" fill="none" stroke="#a8ecff" stroke-width="2.5" stroke-opacity=".75" filter="url(#glow)"/>
<!-- 육·해·공·해병 연결 링크 -->
<g stroke="#7fe0ff" stroke-width="1.6" stroke-dasharray="6 6" fill="none" opacity=".85" filter="url(#glow)">
  <path d="M870 150 Q760 300 660 400"/><path d="M350 548 Q500 470 660 400"/>
  <path d="M1070 520 Q860 450 660 400"/><path d="M680 690 Q680 540 660 400"/><path d="M1060 300 Q860 330 660 400"/>
</g>
<g filter="url(#glow)">
  <circle cx="660" cy="400" r="14" fill="#0b2a4a" stroke="#a8ecff" stroke-width="2.5"/>
  <circle cx="660" cy="400" r="5" fill="#d8f7ff"/>
  <g fill="#d8f7ff"><circle cx="870" cy="150" r="5"/><circle cx="350" cy="548" r="5"/><circle cx="1070" cy="520" r="5"/><circle cx="680" cy="690" r="5"/><circle cx="1060" cy="300" r="5"/></g>
</g>

<!-- 좌측 제목 패널 -->
<rect width="1280" height="800" fill="url(#shade)"/>
<g transform="translate(64 0)">
  <rect x="0" y="92" width="232" height="38" rx="19" fill="#ffd34d"/>
  <text x="116" y="118" text-anchor="middle" class="s" font-size="19" fill="#1a1400">비공식 통합 안내 · 2026</text>
  <text x="0" y="214" class="t" font-size="86" fill="#fff" letter-spacing="2">국군장병</text>
  <text x="0" y="306" class="t" font-size="86" fill="#ffd34d" letter-spacing="2">모집 통합 안내</text>
  <text x="2" y="358" class="s" font-size="27" fill="#d9e6ff">육군 · 해군 · 공군 · 해병대를 한눈에</text>
  <g class="s" font-size="19" transform="translate(2 396)">
    <rect width="132" height="38" rx="10" fill="#4b6b2f"/><text x="66" y="25" text-anchor="middle" fill="#fff">신분별 전형</text>
    <rect x="144" width="120" height="38" rx="10" fill="#1f4e9a"/><text x="204" y="25" text-anchor="middle" fill="#fff">자격 진단</text>
    <rect x="276" width="154" height="38" rx="10" fill="#b0262f"/><text x="353" y="25" text-anchor="middle" fill="#fff">입영·전역 계산</text>
  </g>
</g>
<!-- 하단 마스코트 -->
<g transform="translate(64 610)">
  <rect x="-14" y="-10" width="470" height="170" rx="26" fill="#ffffff" fill-opacity=".12" stroke="#ffffff" stroke-opacity=".3"/>
  <image href="../assets/char/army-blog.png" x="0" y="0" width="110" height="150" preserveAspectRatio="xMidYMax meet"/>
  <image href="../assets/char/navy-blog.png" x="112" y="0" width="110" height="150" preserveAspectRatio="xMidYMax meet"/>
  <image href="../assets/char/airforce-blog.png" x="224" y="0" width="110" height="150" preserveAspectRatio="xMidYMax meet"/>
  <image href="../assets/char/marine-blog.png" x="336" y="0" width="110" height="150" preserveAspectRatio="xMidYMax meet"/>
</g>
<text x="1230" y="776" text-anchor="end" class="s" font-size="18" fill="#cfe3ff" fill-opacity=".85">army-theta.vercel.app</text>
</svg>
</body></html>
